apiVersion: batch/v1
kind: CronJob
metadata:
  name: store-monitor
  namespace: store-monitor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app: store-monitor
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: store-monitor:local
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: store-monitor
              env:
                - name: SUPABASE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: store-monitor
                      key: SUPABASE_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
